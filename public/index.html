<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>🔥 Mersal Chat</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>

  <!-- LOGIN -->
  <div id="loginPage" class="login-page">
    <div class="login-box">
      <h1 class="logo">🔥 Mersal Chat</h1>
      <div class="login-subtitle">دردشة بسيطة وسريعة</div>

      <input id="username" type="text" placeholder="اكتب اسمك" maxlength="20" autocomplete="off">

      <input id="adminPassword" type="password" placeholder="كلمة سر الإدارة" autocomplete="off" style="display:none">

      <div class="colors-title">اختر لون اسمك</div>
      <div class="colors-box">
        <button type="button" class="color-option active-color" style="background:#ffd700" data-color="#ffd700" aria-label="ذهبي"></button>
        <button type="button" class="color-option" style="background:#00d0ff" data-color="#00d0ff" aria-label="أزرق"></button>
        <button type="button" class="color-option" style="background:#00ff88" data-color="#00ff88" aria-label="أخضر"></button>
        <button type="button" class="color-option" style="background:#ff3b3b" data-color="#ff3b3b" aria-label="أحمر"></button>
        <button type="button" class="color-option" style="background:#ff00ff" data-color="#ff00ff" aria-label="وردي"></button>
      </div>

      <button class="join-btn" type="button" onclick="joinChat()">دخول</button>
      <div id="loginStatus" class="login-status"></div>
    </div>
  </div>

  <!-- CHAT -->
  <div id="chatPage" class="chat-page" style="display:none">
    <div class="top-bar">
      <div class="top-left">
        <button class="top-btn" type="button" onclick="openUsers()" aria-label="المتواجدون">👥</button>
        <button class="top-btn" type="button" onclick="openPrivateList()" aria-label="مراسلة خاصة">
          💬<span id="privateBadge" class="private-badge" style="display:none">0</span>
        </button>
        <button class="top-btn admin-btn" type="button" onclick="window.open('/admin.html','_blank')" aria-label="لوحة الإدارة">👑</button>
      </div>
      <div class="top-title">🔥 Mersal</div>
    </div>

    <!-- USERS / PRIVATE LIST -->
    <aside id="usersMenu" class="side-menu" aria-hidden="true">
      <div class="menu-header">
        <div id="menuTitle">👥 المتواجدون</div>
        <button class="close-btn" type="button" onclick="closeUsers()">✕</button>
      </div>
      <div id="usersList" class="users-list"></div>
    </aside>

    <!-- PUBLIC MESSAGES -->
    <main id="messages" class="messages"></main>

    <!-- REPLY -->
    <div id="replyBox" class="reply-box" style="display:none">
      <div id="replyText" class="reply-text"></div>
      <button type="button" onclick="cancelReply()">✕</button>
    </div>

    <!-- PUBLIC INPUT -->
    <div class="message-box">
      <input id="messageInput" type="text" placeholder="اكتب رسالتك..." autocomplete="off" maxlength="2000">
      <button class="send-btn" type="button" onclick="sendMessage()">إرسال</button>
    </div>
  </div>

  <!-- PRIVATE CHAT -->
  <div id="privateChatBox" class="private-chat" style="display:none">
    <div class="private-header">
      <div id="privateTitle">💬 مرسال خاص</div>
      <button class="close-btn" type="button" onclick="closePrivate()">✕</button>
    </div>
    <div id="privateMessages" class="private-messages"></div>
    <div class="private-input-box">
      <input id="privateInput" type="text" placeholder="اكتب رسالة..." autocomplete="off" maxlength="2000">
      <button type="button" onclick="sendPrivate()">إرسال</button>
    </div>
  </div>

  <!-- USER POPUP -->
  <div id="userPopupOverlay" class="popup-overlay" style="display:none" onclick="closeUserPopup()">
    <div class="user-popup" onclick="event.stopPropagation()">
      <div class="popup-header">
        <div id="popupUsername">👤 مستخدم</div>
        <button class="close-btn" type="button" onclick="closeUserPopup()">✕</button>
      </div>
      <div id="popupButtons" class="popup-buttons"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
