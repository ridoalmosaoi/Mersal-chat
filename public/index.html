<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="
width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no
">

<title>

مرسال

</title>

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<!-- LOGIN -->

<div
id="loginScreen"
class="login-screen">

<div class="login-box">

<h2>

مرسال

</h2>

<input
type="text"
id="loginUsername"
placeholder="الاسم">

<input
type="password"
id="loginPassword"
placeholder="كلمة المرور">

<!-- COLOR PICKER -->

<div class="color-picker">

<div
class="color-btn"
style="background:#ffd700"
onclick="selectColor('#ffd700')">
</div>

<div
class="color-btn"
style="background:#ff4444"
onclick="selectColor('#ff4444')">
</div>

<div
class="color-btn"
style="background:#00d0ff"
onclick="selectColor('#00d0ff')">
</div>

<div
class="color-btn"
style="background:#00cc66"
onclick="selectColor('#00cc66')">
</div>

<div
class="color-btn"
style="background:#cc66ff"
onclick="selectColor('#cc66ff')">
</div>

</div>

<button
onclick="login()">

دخول

</button>

</div>

</div>

<!-- CHAT -->

<div
id="chatApp"
class="chat-app"
style="display:none;">

<!-- TOP BAR -->

<div class="top-bar">

<div class="top-icons">

<!-- USERS -->

<span
class="top-icon"
onclick="toggleUsers()">

👥

</span>

<!-- PRIVATE ICON -->

<div
class="private-notify-box"
onclick="openPrivateList()">

<span class="top-icon">

💬

</span>

<span
id="privateNotify"
class="notify-badge"
style="display:none;">

0

</span>

</div>

</div>

<!-- ROOM -->

<div class="room-name">

#العراق

</div>

<div class="top-icons">

<!-- BANNED -->

<span
id="bannedPanelBtn"
class="top-icon"
onclick="openBannedPanel()"
style="display:none;">

🚫

</span>

<!-- SETTINGS -->

<span
class="top-icon"
onclick="
alert(
'مرسال 😎'
)
">

⚙️

</span>

</div>

</div>

<!-- MESSAGES -->

<div
id="messages"
class="messages">

<div class="notice-box">

❤️ أهلاً بكم في شات مرسال

</div>

</div>

<!-- INPUT -->

<div class="chat-input">

<button
onclick="sendMessage()">

➤

</button>

<input
type="text"
id="messageInput"
placeholder="اكتب هنا...">

</div>

</div>

<!-- USERS POPUP -->

<div
id="usersPopup"
class="popup-bg">

<div class="popup-box">

<div
class="online-user"
style="
color:gold;
">

⭐ المتواجدين

</div>

<div id="usersList"></div>

</div>

</div>

<!-- USER MENU -->

<div
id="userMenu"
class="popup-bg">

<div class="popup-box">

<div
class="online-user"
onclick="replyUser()">

📋 نسخ الاسم للرد

</div>

<div
class="online-user"
onclick="openPrivate()">

💬 مرسال خاص

</div>

<div
id="userInfoBtn"
class="online-user"
onclick="showUserInfo()">

ℹ️ معلومات المستخدم

</div>

<div id="adminOptions">

<div
class="online-user"
onclick="kickUser()"
style="
color:orange;
">

⚠️ طرد

</div>

<div
class="online-user"
onclick="banUser()"
style="
color:red;
">

🚫 حظر

</div>

<div
class="online-user"
onclick="disconnectUser()"
style="
color:#ff4444;
">

⛔ فصل كلي

</div>

</div>

</div>

</div>

<!-- PRIVATE CHAT -->

<div
id="privateBox"
class="popup-bg">

<div class="popup-box">

<div
id="privateTitle"
class="online-user"
style="
color:#00d0b4;
">

💬 مرسال خاص

</div>

<div id="privateMessages"></div>

<div class="chat-input">

<button
onclick="sendPrivate()">

➤

</button>

<input
type="text"
id="privateInput"
placeholder="رسالة خاصة">

</div>

</div>

</div>

<!-- PRIVATE LIST -->

<div
id="privateListPopup"
class="popup-bg">

<div class="popup-box">

<div
class="online-user"
style="
color:#00d0b4;
">

💬 المحادثات الخاصة

</div>

<div id="privateList"></div>

</div>

</div>

<!-- USER INFO -->

<div
id="userInfoPopup"
class="popup-bg">

<div class="popup-box">

<div
class="online-user"
style="
color:gold;
">

ℹ️ معلومات المستخدم

</div>

<div
id="userInfoContent">

</div>

</div>

</div>

<!-- BANNED -->

<div
id="bannedPopup"
class="popup-bg">

<div class="popup-box">

<div
class="online-user"
style="
color:red;
">

🚫 المحظورين

</div>

<div id="bannedList"></div>

</div>

</div>

<!-- SOCKET -->

<script src="/socket.io/socket.io.js"></script>

<!-- APP -->

<script src="app.js"></script>

</body>

</html>
