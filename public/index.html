<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<meta
name="theme-color"
content="#000000">

<title>
مرسال شات
</title>

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<!-- LOGIN -->

<div
id="loginScreen"
class="login-screen">

    <div class="login-box">

        <h1 class="logo">
            مرسال
        </h1>

        <div class="sub">
            شات الوطن العربي
        </div>

        <input
        type="text"
        id="loginUsername"
        placeholder="الاسم المستعار">

        <input
        type="password"
        id="loginPassword"
        placeholder="كلمة المرور">

        <button onclick="login()">
            دخول
        </button>

    </div>

</div>

<!-- CHAT -->

<div
id="chatApp"
class="chat-app"
style="display:none;">

    <!-- TOP -->

    <div class="topbar">

        <div class="room-name">
            🇸🇦 الوطن العربي
        </div>

        <div class="online-status">
            ● متصل
        </div>

    </div>

    <!-- PM -->

    <div
    class="chat-notify"
    onclick="openPrivate()">

        💬

        <span id="privateBadge">
            0
        </span>

    </div>

    <!-- ONLINE -->

    <div
    id="onlineList"
    class="online-list"></div>

    <!-- MESSAGES -->

    <div
    id="messages"
    class="messages"></div>

    <!-- INPUT -->

    <div class="input-area">

        <input
        type="text"
        id="messageInput"
        placeholder="اكتب رسالة...">

        <button onclick="sendMessage()">
            ارسال
        </button>

    </div>

</div>

<!-- MENU -->

<div
id="userMenu"
class="user-menu">

    <div onclick="copyUsername()">
        نسخ الاسم للرد
    </div>

    <div onclick="openPrivate()">
        مرسال خاص
    </div>

    <div id="adminOptions">

        <div onclick="kickUser()">
            طرد
        </div>

        <div onclick="banUser()">
            حظر
        </div>

        <div onclick="disconnectUser()">
            فصل كلي
        </div>

    </div>

</div>

<!-- PRIVATE -->

<div
id="privateBox"
class="private-box">

    <div class="private-top">

        <span id="privateName">
            خاص
        </span>

        <button onclick="closePrivate()">
            X
        </button>

    </div>

    <div
    id="privateMessages"
    class="private-messages"></div>

    <div class="private-input">

        <input
        type="text"
        id="privateInput"
        placeholder="اكتب رسالة خاصة">

        <button onclick="sendPrivate()">
            ارسال
        </button>

    </div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script src="app.js"></script>

</body>

</html>
