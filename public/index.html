<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>
مرسال شات
</title>

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<!-- LOGIN -->

<div
id="loginScreen"
class="login-screen">

    <div class="login-box">

        <div class="logo">
            مرسال
        </div>

        <div class="sub">
            شات الوطن العربي
        </div>

        <input
        type="text"
        id="loginUsername"
        placeholder="الاسم المستعار">

        <input
        type="password"
        id="loginPassword"
        placeholder="كلمة المرور">

        <!-- COLORS -->

        <div class="colors">

            <div
            class="color active"
            style="background:#ffd700"
            onclick="selectColor('#ffd700',this)">
            </div>

            <div
            class="color"
            style="background:#00ff99"
            onclick="selectColor('#00ff99',this)">
            </div>

            <div
            class="color"
            style="background:#00bfff"
            onclick="selectColor('#00bfff',this)">
            </div>

            <div
            class="color"
            style="background:#ff44cc"
            onclick="selectColor('#ff44cc',this)">
            </div>

            <div
            class="color"
            style="background:#ffffff"
            onclick="selectColor('#ffffff',this)">
            </div>

        </div>

        <button onclick="login()">
            دخول
        </button>

    </div>

</div>

<!-- CHAT -->

<div
id="chatApp"
class="chat-app"
style="display:none;">

    <!-- TOP -->

    <div class="topbar">

        <!-- MENU -->

        <div
        class="top-icon"
        onclick="toggleMenu()">

            ☰

        </div>

        <!-- USERS -->

        <div
        class="top-icon"
        onclick="toggleUsers()">

            👥

        </div>

        <!-- PRIVATE -->

        <div
        class="top-icon private-icon"
        onclick="openPrivateList()">

            🔔

            <span
            id="privateCount">
            0
            </span>

        </div>

        <div class="room-title">
            # الوطن العربي
        </div>

        <!-- SETTINGS -->

        <div
        id="settingsButton"
        class="top-icon"
        onclick="toggleSettings()">

            ⚙️

        </div>

    </div>

    <!-- USERS POPUP -->

    <div
    id="usersPopup"
    class="popup-bg">

        <div class="popup-box">

            <div class="popup-title">

                المتواجدين

                <span
                id="onlineCount">
                0
                </span>

            </div>

            <div
            id="usersList"></div>

        </div>

    </div>

    <!-- SETTINGS -->

    <div
    id="settingsPopup"
    class="popup-bg">

        <div class="popup-box">

            <div class="popup-title">
                لوحة الإدارة
            </div>

            <!-- BANNED -->

            <div class="admin-section">

                <div class="admin-title">
                    المحظورين
                </div>

                <div
                id="banList"></div>

            </div>

            <!-- DISCONNECTED -->

            <div class="admin-section">

                <div class="admin-title">
                    المفصولين
                </div>

                <div
                id="disconnectList"></div>

            </div>

        </div>

    </div>

    <!-- MESSAGES -->

    <div
    id="messages"
    class="messages"></div>

    <!-- INPUT -->

    <div class="chat-input">

        <div class="emoji-btn">
            😊
        </div>

        <input
        type="text"
        id="messageInput"
        placeholder="اكتب هنا...">

        <button onclick="sendMessage()">
            ➤
        </button>

    </div>

</div>

<!-- USER MENU -->

<div
id="userMenu"
class="user-menu">

    <div onclick="replyUser()">
        نسخ الاسم للرد
    </div>

    <div onclick="openPrivate()">
        مرسال خاص
    </div>

    <div onclick="showUserInfo()">
        معلومات المستخدم
    </div>

    <div id="adminOptions">

        <div onclick="kickUser()">
            طرد
        </div>

        <div onclick="banUser()">
            حظر
        </div>

        <div onclick="disconnectUser()">
            فصل كلي
        </div>

    </div>

</div>

<!-- USER INFO -->

<div
id="userInfoPopup"
class="popup-bg">

    <div class="popup-box">

        <div class="popup-title">
            معلومات المستخدم
        </div>

        <div
        id="userInfoContent"
        class="user-info"></div>

    </div>

</div>

<!-- PRIVATE -->

<div
id="privateBox"
class="private-box">

    <div class="private-top">

        <span id="privateName">
            مرسال خاص
        </span>

        <button onclick="closePrivate()">
            ✕
        </button>

    </div>

    <div
    id="privateMessages"
    class="private-messages"></div>

    <div class="private-input">

        <input
        type="text"
        id="privateInput"
        placeholder="اكتب رسالة خاصة">

        <button onclick="sendPrivate()">
            ارسال
        </button>

    </div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script src="app.js"></script>

</body>

</html>
