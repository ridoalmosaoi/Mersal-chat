<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
مرسال شات
</title>

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<!-- LOGIN -->

<div
id="loginScreen"
class="login-screen">

    <div class="login-box">

        <div class="logo">
            مرسال
        </div>

        <div class="sub">
            شات الوطن العربي
        </div>

        <input
        type="text"
        id="loginUsername"
        placeholder="الاسم">

        <input
        type="password"
        id="loginPassword"
        placeholder="كلمة المرور">

        <div class="colors">

            <div
            class="color active"
            style="background:#ffd700"
            onclick="selectColor('#ffd700',this)">
            </div>

            <div
            class="color"
            style="background:#00ff99"
            onclick="selectColor('#00ff99',this)">
            </div>

            <div
            class="color"
            style="background:#00bfff"
            onclick="selectColor('#00bfff',this)">
            </div>

            <div
            class="color"
            style="background:#ff44cc"
            onclick="selectColor('#ff44cc',this)">
            </div>

        </div>

        <button onclick="login()">
            دخول
        </button>

    </div>

</div>

<!-- CHAT -->

<div
id="chatApp"
class="chat-app"
style="display:none;">

    <div class="topbar">

        <div
        class="top-icon"
        onclick="toggleUsers(event)">

            👥

        </div>

        <div
        class="top-icon"
        onclick="openPrivateList(event)">

            🔔

            <span id="privateCount">
                0
            </span>

        </div>

        <div class="room-title">
            # الوطن العربي
        </div>

        <div
        id="settingsButton"
        class="top-icon"
        onclick="toggleSettings(event)">

            ⚙️

        </div>

    </div>

    <!-- USERS -->

    <div
    id="usersPopup"
    class="popup-bg">

        <div class="popup-box">

            <div class="popup-title">
                المتواجدين
            </div>

            <div id="usersList"></div>

        </div>

    </div>

    <!-- SETTINGS -->

    <div
    id="settingsPopup"
    class="popup-bg">

        <div class="popup-box">

            <div class="popup-title">
                لوحة الإدارة
            </div>

            <div id="banList"></div>

        </div>

    </div>

    <!-- USER INFO -->

    <div
    id="userInfoPopup"
    class="popup-bg">

        <div class="popup-box">

            <div class="popup-title">
                معلومات المستخدم
            </div>

            <div
            id="userInfoContent"
            class="user-info"></div>

        </div>

    </div>

    <!-- PRIVATE -->

    <div
    id="privateBox"
    class="popup-bg">

        <div class="popup-box private-chat">

            <div class="private-top">

                <span id="privateName">
                    المحادثات الخاصة
                </span>

                <button onclick="closePrivate(event)">
                    ✕
                </button>

            </div>

            <div
            id="privateMessages"
            class="private-messages"></div>

            <div class="private-input">

                <input
                type="text"
                id="privateInput"
                placeholder="اكتب رسالة">

                <button onclick="sendPrivate()">
                    ارسال
                </button>

            </div>

        </div>

    </div>

    <!-- USER MENU -->

    <div
    id="userMenu"
    class="user-menu">

        <div onclick="replyUser()">
            نسخ الاسم للرد
        </div>

        <div onclick="openPrivate()">
            مرسال خاص
        </div>

        <div
        id="userInfoButton"
        onclick="showUserInfo()">

            معلومات المستخدم
        </div>

        <div
        id="adminOptions">

            <div onclick="banUser()">
                حظر
            </div>

            <div onclick="disconnectUser()">
                فصل كلي
            </div>

        </div>

    </div>

    <!-- MESSAGES -->

    <div
    id="messages"
    class="messages"></div>

    <!-- INPUT -->

    <div class="chat-input">

        <input
        type="text"
        id="messageInput"
        placeholder="اكتب هنا...">

        <button onclick="sendMessage()">
            ارسال
        </button>

    </div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script src="app.js"></script>

</body>

</html>
