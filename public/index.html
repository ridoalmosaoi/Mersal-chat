<!DOCTYPE html>

<html lang="ar">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>مرسال شات</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <!-- =========================
         شريط الغرفة
    ========================== -->

    <div class="room-bar">

        <div class="room-icons">

            <span>⚙️</span>

            <span>💬</span>

            <span>👥</span>

        </div>

        <div class="room-name">

            #العراق

        </div>

    </div>

    <!-- =========================
         معلومات المستخدم
    ========================== -->

    <div class="user-info">

        <div class="user-info-title">

            ℹ️ معلومات المستخدم

        </div>

        <div class="user-info-content">

            <div class="user-name">

                Admin :الاسم

            </div>

            <div class="user-ip">

                IP: 2a01:799:1f32:4400:1885:ce5b:e6d8:9191

            </div>

            <div class="user-browser">

                Browser: Mozilla/5.0 (iPhone; CPU iPhone OS 18_4 like Mac OS X)

            </div>

            <div class="user-device">

                📱 iPhone

            </div>

        </div>

    </div>

    <!-- =========================
         الشات الخاص
    ========================== -->

    <div id="privateChatBox"
         class="private-chat-box">

        <!-- الهيدر -->

        <div class="private-header">

            <div class="private-user-info">

                <div class="private-avatar">

                    👤

                </div>

                <div class="private-name-status">

                    <div id="privateChatTitle"
                         class="private-username">

                        Ahmed

                    </div>

                    <div class="private-status">

                        متصل الآن

                    </div>

                </div>

            </div>

            <button class="close-private-btn"
                    onclick="closePrivateChat()">

                ✕

            </button>

        </div>

        <!-- الرسائل -->

        <div id="privateMessages"
             class="private-messages">

            <div class="message">

                هلا بيك 😄

            </div>

            <div class="message my-message">

                هلا والله 🔥

            </div>

            <div class="message">

                هذا الشكل الجديد للخاص

            </div>

        </div>

        <!-- الكتابة -->

        <div class="private-input-area">

            <input type="text"
                   id="privateMessageInput"
                   placeholder="اكتب رسالة خاصة">

            <button onclick="sendPrivateMessage()">

                ➤

            </button>

        </div>

    </div>

    <!-- =========================
         الجافاسكربت
    ========================== -->

    <script src="app.js"></script>

</body>

</html>
