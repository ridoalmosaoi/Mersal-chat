<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="
width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no
">

<title>

مرسال شات

</title>

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<!-- LOGIN -->

<div
id="loginScreen"
class="login-screen">

<div class="login-box">

<h2>

مرسال شات

</h2>

<input
type="text"
id="loginUsername"
placeholder="الاسم">

<input
type="password"
id="loginPassword"
placeholder="كلمة المرور">

<button
onclick="login()">

دخول

</button>

</div>

</div>

<!-- CHAT -->

<div
id="chatApp"
class="chat-app"
style="display:none;">

<!-- TOP -->

<div class="top-bar">

<div class="room-name">

#العراق

</div>

<div>

<span
onclick="toggleUsers()"
style="
font-size:32px;
cursor:pointer;
margin-left:15px;
">

👥

</span>

<span
onclick="alert('الاعدادات قريباً 😎')"
style="
font-size:32px;
cursor:pointer;
">

⚙️

</span>

</div>

</div>

<!-- MESSAGES -->

<div
id="messages"
class="messages">

<div class="notice-box">

❤️ اهلا بكم في مرسال شات،
نتمنى لكم وقت ممتع

</div>

</div>

<!-- INPUT -->

<div class="chat-input">

<button
onclick="sendMessage()">

➤

</button>

<input
type="text"
id="messageInput"
placeholder="اكتب هنا...">

</div>

</div>

<!-- USERS POPUP -->

<div
id="usersPopup"
class="popup-bg">

<div class="popup-box">

<div
class="online-user"
style="
color:gold;
">

⭐ المتواجدين

</div>

<div id="usersList"></div>

</div>

</div>

<!-- PRIVATE -->

<div
id="privateBox"
class="popup-bg">

<div class="popup-box">

<div
class="online-user"
style="
color:gold;
">

💬 مرسال خاص

</div>

<div
id="privateMessages">

</div>

<div class="chat-input">

<button
onclick="sendPrivate()">

➤

</button>

<input
type="text"
id="privateInput"
placeholder="رسالة خاصة">

</div>

</div>

</div>

<!-- USER MENU -->

<div
id="userMenu"
class="popup-bg">

<div class="popup-box">

<div
class="online-user"
onclick="replyUser()">

📋 نسخ الاسم للرد

</div>

<div
class="online-user"
onclick="openPrivate()">

💬 مرسال خاص

</div>

<div
class="online-user"
onclick="showUserInfo()">

ℹ️ معلومات المستخدم

</div>

<div id="adminOptions">

<div
class="online-user"
onclick="kickUser()"
style="
color:orange;
">

⚠️ طرد

</div>

<div
class="online-user"
onclick="banUser()"
style="
color:red;
">

⛔ حظر

</div>

<div
class="online-user"
onclick="disconnectUser()"
style="
color:#ff4444;
">

🚫 فصل كلي

</div>

</div>

</div>

</div>

<!-- USER INFO -->

<div
id="userInfoPopup"
class="popup-bg">

<div class="popup-box">

<div
class="online-user"
style="
color:gold;
">

ℹ️ معلومات المستخدم

</div>

<div
id="userInfoContent">

</div>

</div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script src="app.js"></script>

</body>

</html>
