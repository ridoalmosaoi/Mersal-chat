<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="
width=device-width,
initial-scale=1.0,
maximum-scale=1.0
">

<title>

Mersal Chat

</title>

<link
rel="stylesheet"
href="style.css?v=300"
>

</head>

<body>

<!-- LOGIN PAGE -->

<div
id="loginPage"
class="login-page"
>

<div class="login-box">

<h1 class="logo">

🔥 Mersal Chat

</h1>

<input
type="text"
id="username"
placeholder="اكتب اسمك"
maxlength="20"
autocomplete="off"
>

<!-- ADMIN PASSWORD -->

<input
type="password"
id="adminPassword"
placeholder="كلمة سر الإدارة"
style="display:none;"
autocomplete="off"
>

<!-- COLORS -->

<div class="colors-box">

<div
class="color-option active-color"
style="background:#ffd700;"
data-color="#ffd700"
onclick="selectColor('#ffd700')"
></div>

<div
class="color-option"
style="background:#00d0ff;"
data-color="#00d0ff"
onclick="selectColor('#00d0ff')"
></div>

<div
class="color-option"
style="background:#ff3b3b;"
data-color="#ff3b3b"
onclick="selectColor('#ff3b3b')"
></div>

<div
class="color-option"
style="background:#00ff88;"
data-color="#00ff88"
onclick="selectColor('#00ff88')"
></div>

<div
class="color-option"
style="background:#ff00ff;"
data-color="#ff00ff"
onclick="selectColor('#ff00ff')"
></div>

</div>

<button
class="join-btn"
onclick="joinChat()"
>

دخول الشات

</button>

</div>

</div>

<!-- CHAT PAGE -->

<div
id="chatPage"
class="chat-page"
style="display:none;"
>

<!-- TOP BAR -->

<div class="top-bar">

<div class="top-left">

<button
class="top-btn"
onclick="openMenu('usersMenu')"
>

👥

</button>

<button
class="top-btn"
onclick="openMenu('privateChatBox')"
>

💬

<span
id="privateBadge"
class="private-badge"
style="display:none;"
>

0

</span>

</button>

</div>

<div class="top-title">

🔥 Mersal Chat

</div>

</div>

<!-- USERS MENU -->

<div
id="usersMenu"
class="side-menu"
style="display:none;"
>

<div class="menu-header">

👥 المتصلين

<button
class="close-btn"
onclick="closeMenu('usersMenu')"
>

✖

</button>

</div>

<div
id="usersList"
class="users-list"
>

</div>

</div>

<!-- MESSAGES -->

<div
id="messages"
class="messages"
>

</div>

<!-- MESSAGE BOX -->

<div class="message-box">

<input
type="text"
id="messageInput"
placeholder="اكتب رسالتك..."
autocomplete="off"
>

<button
class="send-btn"
onclick="sendMessage()"
>

إرسال

</button>

</div>

</div>

<!-- PRIVATE CHAT -->

<div
id="privateChatBox"
class="private-chat"
style="display:none;"
>

<div class="private-header">

<div
id="privateChatTitle"
>

📩 الخاص

</div>

<button
class="close-btn"
onclick="closePrivateChat()"
>

✖

</button>

</div>

<div
id="privateMessages"
class="private-messages"
>

</div>

<div class="private-input-box">

<input
type="text"
id="privateMessageInput"
placeholder="اكتب رسالة خاصة..."
autocomplete="off"
>

<button
onclick="sendPrivateMessage()"
>

إرسال

</button>

</div>

</div>

<!-- SOCKET -->

<script src="
https://cdn.socket.io/4.7.5/socket.io.min.js
"></script>

<!-- APP -->

<script src="app.js?v=300"></script>

</body>

</html>
