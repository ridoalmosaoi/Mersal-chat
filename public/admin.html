<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0"
>

<title>

لوحة إدارة مرسال

</title>

<link
rel="stylesheet"
href="admin.css"
>

</head>

<body>

<!-- LOGIN -->

<div
id="adminLogin"
class="login-page"
>

<div class="login-box">

<h1 class="logo">

👑 لوحة الإدارة

</h1>

<input
id="adminName"
type="text"
placeholder="اسم الإدارة"
>

<input
id="adminPass"
type="password"
placeholder="كلمة السر"
>

<button
onclick="loginAdmin()"
class="login-btn"
>

دخول

</button>

</div>

</div>

<!-- PANEL -->

<div
id="adminPanel"
style="display:none"
class="admin-panel"
>

<div class="top-bar">

<div class="top-title">

👑 Mersal Control

</div>

</div>

<!-- STATS -->

<div
id="statsBox"
class="stats-box"
>

📊 جاري التحميل...

</div>

<!-- ACTION LOGS -->

<div class="admin-box">

<h2>

📜 سجل التنفيذ

</h2>

<div
id="logsBox"
class="logs-box"
>

</div>

</div>

<!-- USERS -->

<div class="admin-box">

<h2>

👥 المتصلين

</h2>

<div
id="onlineUsers"
class="users-container"
>

</div>

</div>

<!-- ADD ADMIN -->

<div class="admin-box">

<h2>

👮 إضافة أدمن

</h2>

<input
id="newAdminName"
placeholder="اسم الأدمن"
>

<input
id="newAdminPassword"
placeholder="كلمة السر"
>

<label>
<input type="checkbox" id="permKick">
طرد
</label>

<label>
<input type="checkbox" id="permBan">
حظر
</label>

<label>
<input type="checkbox" id="permViewUser">
معلومات المستخدم
</label>

<label>
<input type="checkbox" id="permAddAdmin">
إضافة أدمن
</label>

<button
onclick="addAdmin()"
class="login-btn"
>

➕ إضافة

</button>

</div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script src="admin.js"></script>

</body>

</html>
