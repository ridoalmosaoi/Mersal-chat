<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="
width=device-width,
initial-scale=1.0
">

<title>

لوحة إدارة مرسال

</title>

<link
rel="stylesheet"
href="admin.css?v=9">

<style>

body{

background:#111;

color:white;

font-family:sans-serif;

margin:0;

padding:15px;

}

.admin-container{

max-width:1000px;

margin:auto;

}

.admin-box{

background:#1c1c1c;

padding:20px;

border-radius:20px;

margin-bottom:20px;

}

h1{

text-align:center;

color:#ffd700;

margin-bottom:25px;

}

h2{

margin-bottom:15px;

color:#00d0ff;

}

input{

width:100%;

padding:14px;

border:none;

border-radius:12px;

background:#2a2a2a;

color:white;

margin-bottom:12px;

font-size:16px;

}

button{

padding:12px 16px;

border:none;

border-radius:12px;

background:#ffd700;

color:black;

font-size:15px;

cursor:pointer;

margin-top:10px;

margin-left:5px;

}

.user-card{

background:#2a2a2a;

padding:14px;

border-radius:14px;

margin-top:10px;

line-height:1.8;

word-break:break-word;

}

.settings-buttons{

display:flex;

flex-wrap:wrap;

gap:10px;

}

</style>

</head>

<body>

<div class="admin-container">

<h1>

👑 لوحة إدارة مرسال

</h1>

<!-- LOGIN -->

<div
id="adminLogin"
class="admin-box">

<h2>

🔐 تسجيل دخول الإدارة

</h2>

<input
type="text"
id="adminName"
placeholder="اسم الأدمن">

<input
type="password"
id="adminPassword"
placeholder="كلمة السر">

<button
onclick="loginAdmin()">

دخول

</button>

</div>

<!-- PANEL -->

<div
id="adminPanel"
style="display:none;">

<!-- SERVER -->

<div class="admin-box">

<h2>

📊 معلومات السيرفر

</h2>

<div id="serverInfo">

🟢 جاري التحميل...

</div>

</div>

<!-- ONLINE -->

<div class="admin-box">

<h2>

👥 المتصلين

</h2>

<div id="onlineUsers"></div>

</div>

<!-- BANNED -->

<div class="admin-box">

<h2>

🚫 المحظورين

</h2>

<div id="bannedUsers"></div>

</div>

<!-- ADMINS -->

<div class="admin-box">

<h2>

👮 الأدمنية

</h2>

<div id="adminsList"></div>

<hr>

<input
type="text"
id="newAdminName"
placeholder="اسم الأدمن">

<input
type="password"
id="newAdminPassword"
placeholder="كلمة سر الأدمن">

<button
onclick="addAdmin()">

➕ إضافة أدمن

</button>

</div>

<!-- SETTINGS -->

<div class="admin-box">

<h2>

⚙️ التحكم بالسيرفر

</h2>

<div class="settings-buttons">

<button onclick="toggleChatLock()">

🔒 قفل العام

</button>

<button onclick="togglePrivateLock()">

💬 تعطيل الخاص

</button>

<button onclick="clearChat()">

🧹 تنظيف الشات

</button>

<button onclick="maintenanceMode()">

🛠️ صيانة

</button>

</div>

</div>

<!-- LOGS -->

<div class="admin-box">

<h2>

📜 السجل

</h2>

<div id="logsBox"></div>

</div>

</div>

</div>

<!-- SOCKET FIX -->

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<!-- ADMIN JS -->

<script src="admin.js?v=99"></script>

</body>

</html>
