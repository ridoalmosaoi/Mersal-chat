<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1"
>

<title>
👑 لوحة إدارة مرسال
</title>

<link
rel="stylesheet"
href="admin.css?v=1"
>

</head>

<body>

<!-- LOGIN -->

<div
id="adminLogin"
class="login-page"
>

<div class="login-box">

<h1 class="logo">

👑 لوحة الإدارة

</h1>

<input
id="adminName"
type="text"
placeholder="اسم الإدارة"
autocomplete="off"
>

<input
id="adminPass"
type="password"
placeholder="كلمة السر"
autocomplete="off"
>

<button
class="login-btn"
onclick="loginAdmin()"
>

دخول

</button>

</div>

</div>

<!-- PANEL -->

<div
id="adminPanel"
class="admin-panel"
style="display:none"
>

<!-- TOP -->

<div class="top-bar">

<div class="top-title">

👑 Mersal Control

</div>

</div>

<!-- STATS -->

<div
id="statsBox"
class="stats-box"
>

📊 جاري التحميل...

</div>

<!-- LOGS -->

<div class="admin-box">

<h2>

📜 سجل التنفيذ

</h2>

<div
id="logsBox"
class="logs-box"
>

</div>

</div>

<!-- USERS -->

<div class="admin-box">

<h2>

👥 المتصلون

</h2>

<div
id="onlineUsers"
class="users-container"
>

</div>

</div>

<!-- ADD ADMIN -->

<div class="admin-box">

<h2>

👮 إضافة أدمن

</h2>

<input
id="newAdminName"
placeholder="اسم الأدمن"
>

<input
id="newAdminPassword"
placeholder="كلمة السر"
>

<!-- PERMISSIONS -->

<div class="permissions">

<label>

<input
id="permKick"
type="checkbox"
>

⚠️ طرد

</label>

<label>

<input
id="permBan"
type="checkbox"
>

🚫 حظر

</label>

<label>

<input
id="permMute"
type="checkbox"
>

🔇 كتم

</label>

<label>

<input
id="permDisconnect"
type="checkbox"
>

⛔ فصل جهاز

</label>

<label>

<input
id="permViewUser"
type="checkbox"
>

ℹ️ معلومات مستخدم

</label>

<label>

<input
id="permAddAdmin"
type="checkbox"
>

👮 إضافة أدمن

</label>

</div>

<button
class="login-btn"
onclick="addAdmin()"
>

➕ إضافة الأدمن

</button>

</div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script src="admin.js?v=1"></script>

</body>

</html>
