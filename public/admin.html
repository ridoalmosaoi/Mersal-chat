<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="
width=device-width,
initial-scale=1.0
">

<title>

لوحة إدارة مرسال

</title>

<link
rel="stylesheet"
href="admin.css">

</head>

<body>

<div class="admin-container">

<!-- TITLE -->

<h1>

👑 لوحة إدارة مرسال

</h1>

<!-- LOGIN -->

<div
id="adminLogin"
class="admin-box">

<h2>

🔐 تسجيل دخول الإدارة

</h2>

<input
type="text"
id="adminName"
placeholder="اسم الأدمن">

<input
type="password"
id="adminPassword"
placeholder="كلمة السر">

<button
onclick="loginAdmin()">

دخول

</button>

</div>

<!-- PANEL -->

<div
id="adminPanel"
style="display:none;">

<!-- SERVER INFO -->

<div class="admin-box">

<h2>

📊 معلومات السيرفر

</h2>

<div id="serverInfo">

🟢 جاري التحميل...

</div>

</div>

<!-- ONLINE USERS -->

<div class="admin-box">

<h2>

👥 المتصلين

</h2>

<div id="onlineUsers">

<div class="user-card">

جاري التحميل...

</div>

</div>

</div>

<!-- BANNED USERS -->

<div class="admin-box">

<h2>

🚫 المحظورين

</h2>

<div id="bannedUsers">

<div class="user-card">

لا يوجد محظورين

</div>

</div>

</div>

<!-- ADMINS -->

<div class="admin-box">

<h2>

👮 الأدمنية

</h2>

<div id="adminsList">

<div class="user-card">

جاري التحميل...

</div>

</div>

<hr>

<h2>

➕ إضافة أدمن

</h2>

<input
type="text"
id="newAdminName"
placeholder="اسم الأدمن">

<input
type="password"
id="newAdminPassword"
placeholder="كلمة سر الأدمن">

<button
onclick="addAdmin()">

إضافة أدمن

</button>

</div>

<!-- SETTINGS -->

<div class="admin-box">

<h2>

⚙️ التحكم بالسيرفر

</h2>

<div class="settings-buttons">

<button
onclick="toggleChatLock()">

🔒 قفل/فتح العام

</button>

<button
onclick="togglePrivateLock()">

💬 تعطيل/تفعيل الخاص

</button>

<button
onclick="clearChat()">

🧹 تنظيف الشات

</button>

<button
onclick="maintenanceMode()">

🛠️ وضع صيانة

</button>

</div>

</div>

<!-- LOGS -->

<div class="admin-box">

<h2>

📜 السجل

</h2>

<div id="logsBox">

<div class="user-card">

لا يوجد سجلات

</div>

</div>

</div>

</div>

</div>

<!-- SOCKET -->

<script src="/socket.io/socket.io.js"></script>

<!-- ADMIN JS -->

<script src="admin.js"></script>

</body>

</html>
