<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="
width=device-width,
initial-scale=1.0,
maximum-scale=1.0
">

<title>

لوحة إدارة مرسال

</title>

<link
rel="stylesheet"
href="admin.css?v=1000"
>

</head>

<body>

<!-- LOGIN -->

<div
id="adminLogin"
class="login-page"
>

<div class="login-box">

<h1 class="logo">

👑 لوحة إدارة مرسال

</h1>

<input
type="text"
id="adminName"
placeholder="اسم الإدارة"
autocomplete="off"
>

<input
type="password"
id="adminPassword"
placeholder="كلمة السر"
autocomplete="off"
>

<button
class="login-btn"
onclick="loginAdmin()"
>

دخول الإدارة

</button>

</div>

</div>

<!-- PANEL -->

<div
id="adminPanel"
class="admin-panel"
style="display:none;"
>

<!-- TOP -->

<div class="top-bar">

<div class="top-title">

👑 Mersal Control

</div>

<div class="top-actions">

<button
class="top-btn red-btn"
onclick="maintenanceMode()"
>

🛠️

</button>

<button
class="top-btn yellow-btn"
onclick="clearChat()"
>

🧹

</button>

<button
class="top-btn blue-btn"
onclick="togglePrivateLock()"
>

💬

</button>

<button
class="top-btn orange-btn"
onclick="toggleChatLock()"
>

🔒

</button>

</div>

</div>

<!-- STATS -->

<div
id="serverInfo"
class="stats-box"
>

📊 جاري التحميل...

</div>

<!-- CONTENT -->

<div class="admin-content">

<!-- ONLINE USERS -->

<div class="admin-box">

<h2>

👥 المتصلين

</h2>

<div
id="onlineUsers"
class="users-container"
>

</div>

</div>

<!-- BANNED -->

<div class="admin-box">

<h2>

🚫 المحظورين

</h2>

<div
id="bannedUsers"
class="users-container"
>

</div>

</div>

<!-- ADMINS -->

<div class="admin-box">

<h2>

👮 الإدارة

</h2>

<div class="add-admin-box">

<input
type="text"
id="newAdminName"
placeholder="اسم الأدمن"
autocomplete="off"
>

<input
type="password"
id="newAdminPassword"
placeholder="كلمة السر"
autocomplete="off"
>

<button
class="add-btn"
onclick="addAdmin()"
>

➕ إضافة

</button>

</div>

<div
id="adminsList"
class="users-container"
>

</div>

</div>

<!-- LOGS -->

<div class="admin-box">

<h2>

📜 السجل

</h2>

<div
id="logsBox"
class="logs-box"
>

<div class="log-item">

لا يوجد سجلات

</div>

</div>

</div>

</div>

</div>

<!-- SOCKET -->

<script src="
https://cdn.socket.io/4.7.5/socket.io.min.js
"></script>

<!-- ADMIN JS -->

<script src="
admin.js?v=1000
"></script>

</body>

</html>
