<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1"
>

<title>
👑 لوحة إدارة مرسال
</title>

<link
rel="stylesheet"
href="admin.css"
>

</head>

<body>

<!-- LOGIN -->

<div
id="adminLogin"
class="login-page"
>

<div class="login-box">

<h1 class="logo">

👑 لوحة الإدارة

</h1>

<input
id="adminName"
type="text"
placeholder="اسم الإدارة"
>

<input
id="adminPass"
type="password"
placeholder="كلمة السر"
>

<button
class="login-btn"
onclick="loginAdmin()"
>

دخول

</button>

</div>

</div>

<!-- PANEL -->

<div
id="adminPanel"
class="admin-panel"
style="display:none"
>

<!-- TOP -->

<div class="top-bar">

<div class="top-title">

👑 Mersal Control

</div>

</div>

<!-- STATS -->

<div
id="statsBox"
class="stats-box"
>

📊 جاري التحميل...

</div>

<!-- LOGS -->

<div class="admin-box">

<h2>

📜 سجل التنفيذ

</h2>

<div
id="logsBox"
class="logs-box"
>

</div>

</div>

<!-- USERS -->

<div class="admin-box">

<h2>

👥 المتصلون

</h2>

<div
id="onlineUsers"
class="users-container"
>

</div>

</div>

<!-- CHAT CONTROL -->

<div class="admin-box">

<h2>

⚙️ التحكم بالشات

</h2>

<div class="user-actions">

<button onclick="unbanAll()">
🔓 فك الحظر
</button>

<button onclick="unmuteAll()">
🔊 فك الكتم
</button>
  <button onclick="undisconnectAll()">
⛔🔓 فك الفصل
</button>

<button onclick="clearChat()">
🧹 تنظيف
</button>

<button onclick="toggleChatLock()">
🔒 العام
</button>

<button onclick="togglePrivateLock()">
💬 الخاص
</button>

<button onclick="toggleMaintenance()">
  <button onclick="toggleStarsMode()">
⭐ وضع النجوم
</button>
🛠️ الصيانة
</button>

</div>

</div>

<!-- ADD ADMIN -->

<div class="admin-box">

<h2>

👮 إضافة أدمن

</h2>

<input
id="newAdminName"
placeholder="اسم الأدمن"
>

<input
id="newAdminPassword"
type="password"
placeholder="كلمة السر"
>

<div class="permissions">

<label>
<input id="permKick" type="checkbox">
⚠️ طرد
</label>

<label>
<input id="permBan" type="checkbox">
🚫 حظر
</label>

<label>
<input id="permUnban" type="checkbox">
🔓 فك حظر
</label>

<label>
<input id="permMute" type="checkbox">
🔇 كتم
</label>

<label>
<input id="permUnmute" type="checkbox">
🔊 فك كتم
</label>

<label>
<input id="permDisconnect" type="checkbox">
⛔ فصل
</label>

<label>
<input id="permDeleteMessage" type="checkbox">
🗑 حذف رسالة
</label>

<label>
<input id="permViewUser" type="checkbox">
ℹ️ معلومات
</label>

<label>
<input id="permStars" type="checkbox">
⭐ النجوم
</label>

<label>
<input id="permChatLock" type="checkbox">
🔒 قفل العام
</label>

<label>
<input id="permPrivateLock" type="checkbox">
💬 قفل الخاص
</label>

<label>
<input id="permMaintenance" type="checkbox">
🛠️ الصيانة
</label>

<label>
<input id="permProtection" type="checkbox">
🛡️ الحماية
</label>

<label>
<input id="permAddAdmin" type="checkbox">
👮 إدارة الأدمنية
</label>

</div>

<button
class="login-btn"
onclick="addAdmin()"
>

➕ إضافة الأدمن

</button>

</div>
<div class="admin-box">

<h2>

🚫 المحظورون

</h2>

<div

id="bannedList"

class="users-container"

>

</div>

</div>
  <div class="admin-box">

<h2>
🔇 المكتومون
</h2>

<div
id="mutedList"
class="users-container"
>
</div>

</div>
  <div class="admin-box">

<h2>
⛔ المفصولون
</h2>

<div
id="disconnectedList"
class="users-container"
>
</div>

</div>
<!-- ADMINS LIST -->

<div class="admin-box">

<h2>

👮 قائمة الأدمنية

</h2>

<div
id="adminsList"
class="users-container"
>

</div>

</div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script src="admin.js"></script>

</body>
</html>
